<style>
:root { --ink: #141414; --muted: #666; --accent: #d7261e; --line: #e2e2e2; --bg: #f4f4f4; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.7 "Pretendard", system-ui, sans-serif; }

h1 { margin: 8px 0 12px; font-size: 28px; line-height: 1.3; }
p { color: var(--muted); margin: 0 0 12px; }
a.btn { display: block; margin-top: 12px; padding: 16px 20px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; text-align: center; text-decoration: none; }
a.btn.line { background: #fff; color: var(--ink); border: 1px solid var(--line); }
ul { margin: 20px 0 0; padding: 16px 0 0 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
small { display: block; margin-top: 16px; color: #999; font-size: 12px; }
</style>
</head>
